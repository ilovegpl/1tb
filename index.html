<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 2D Top-Down Shooter</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #menu {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
            z-index: 10;
        }
        button, input {
            padding: 10px 15px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            outline: none;
        }
        button {
            background: #28a745;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #218838; }
        input { background: #222; color: #fff; border: 1px solid #444; }
        canvas {
            background: #1e1e1e;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: none;
        }
        #ui {
            display: none;
            position: absolute;
            top: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 5;
        }
    </style>
    <!-- PeerJS for P2P Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="menu">
        <h2>P2P 2D Shooter</h2>
        <p>Controls: <b>WASD</b> to Move | <b>Mouse</b> to Aim & Shoot</p>
        <button id="hostBtn">Create Game (Host)</button>
        <br><br>
        <input type="text" id="peerIdInput" placeholder="Enter Host Code">
        <button id="joinBtn">Join Game</button>
        <p id="status" style="font-size: 14px; color: #aaa;"></p>
    </div>

    <div id="ui">Health: <span id="healthVal">100</span> | Score: <span id="scoreVal">0</span></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const ui = document.getElementById('ui');
        const statusText = document.getElementById('status');

        let peer, conn;
        let isHost = false;
        let gameStarted = false;

        // Game State
        let players = {};
        let bullets = [];
        let myId = null;
        let score = 0;
        let health = 100;

        const keys = { w: false, a: false, s: false, d: false };
        const mouse = { x: 0, y: 0, down: false };

        // Input Listeners
        window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', () => mouse.down = true);
        canvas.addEventListener('mouseup', () => mouse.down = false);

        // Host Game
        document.getElementById('hostBtn').onclick = () => {
            peer = new Peer();
            isHost = true;

            peer.on('open', id => {
                myId = id;
                statusText.innerHTML = `Your Host Code:<br><b>${id}</b><br>Share this code with your friend! Waiting for connection...`;
                document.getElementById('hostBtn').disabled = true;
                document.getElementById('joinBtn').disabled = true;
            });

            peer.on('connection', connection => {
                conn = connection;
                setupConnection();
                startGame();
            });
        };

        // Join Game
        document.getElementById('joinBtn').onclick = () => {
            const hostId = document.getElementById('peerIdInput').value.trim();
            if (!hostId) { alert('Please enter a host code!'); return; }

            peer = new Peer();
            isHost = false;

            peer.on('open', id => {
                myId = id;
                conn = peer.connect(hostId);
                setupConnection();
                startGame();
            });
        };

        function setupConnection() {
            conn.on('open', () => {
                console.log('Connected to peer!');
            });

            conn.on('data', data => {
                if (isHost) {
                    // Host receives inputs/actions from client
                    if (data.type === 'input') {
                        if (players[data.id]) {
                            players[data.id].x = data.x;
                            players[data.id].y = data.y;
                            players[data.id].angle = data.angle;
                        }
                    } else if (data.type === 'shoot') {
                        bullets.push(data.bullet);
                    }
                } else {
                    // Client receives game state update from host
                    if (data.type === 'state') {
                        players = data.players;
                        bullets = data.bullets;
                        if (players[myId]) {
                            health = players[myId].health;
                            score = players[myId].score;
                        }
                    }
                }
            });

            conn.on('close', () => {
                alert('Disconnected from peer.');
                location.reload();
            });
        }

        function startGame() {
            menu.style.display = 'none';
            canvas.style.display = 'block';
            ui.style.display = 'block';
            gameStarted = true;

            // Initialize local player
            players[myId] = {
                x: Math.random() * 600 + 100,
                y: Math.random() * 400 + 100,
                angle: 0,
                health: 100,
                score: 0,
                color: isHost ? '#ff4757' : '#2ed573'
            };

            requestAnimationFrame(gameLoop);
        }

        let lastShootTime = 0;
        function gameLoop() {
            if (!gameStarted) return;

            // 1. Local Movement Handling
            let p = players[myId];
            if (p && p.health > 0) {
                let speed = 3;
                if (keys.w && p.y > 15) p.y -= speed;
                if (keys.s && p.y < canvas.height - 15) p.y += speed;
                if (keys.a && p.x > 15) p.x -= speed;
                if (keys.d && p.x < canvas.width - 15) p.x += speed;

                p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);

                // Shooting
                if (mouse.down && Date.now() - lastShootTime > 300) {
                    lastShootTime = Date.now();
                    let newBullet = {
                        x: p.x,
                        y: p.y,
                        vx: Math.cos(p.angle) * 7,
                        vy: Math.sin(p.angle) * 7,
                        owner: myId
                    };
                    if (isHost) {
                        bullets.push(newBullet);
                    } else {
                        conn.send({ type: 'shoot', bullet: newBullet });
                    }
                }

                // Send input if client
                if (!isHost) {
                    conn.send({ type: 'input', id: myId, x: p.x, y: p.y, angle: p.angle });
                }
            }

            // 2. Host Simulation Logic
            if (isHost) {
                // Update bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    // Wall collision
                    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                        bullets.splice(i, 1);
                        continue;
                    }

                    // Player collision
                    for (let id in players) {
                        if (id !== b.owner && players[id].health > 0) {
                            let dist = Math.hypot(players[id].x - b.x, players[id].y - b.y);
                            if (dist < 15) {
                                players[id].health -= 25;
                                bullets.splice(i, 1);
                                if (players[id].health <= 0) {
                                    players[b.owner].score += 1;
                                    // Respawn
                                    setTimeout(() => {
                                        if (players[id]) {
                                            players[id].health = 100;
                                            players[id].x = Math.random() * 600 + 100;
                                            players[id].y = Math.random() * 400 + 100;
                                        }
                                    }, 2000);
                                }
                                break;
                            }
                        }
                    }
                }

                // Broadcast state to client
                conn.send({ type: 'state', players: players, bullets: bullets });
            }

            // 3. Render Graphics
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Bullets
            ctx.fillStyle = '#ffa502';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Players
            for (let id in players) {
                let pl = players[id];
                if (pl.health <= 0) continue;

                ctx.save();
                ctx.translate(pl.x, pl.y);
                ctx.rotate(pl.angle);

                // Body
                ctx.fillStyle = pl.color;
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();

                // Gun Barrel
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, -4, 20, 8);

                ctx.restore();

                // Health Bar over player
                ctx.fillStyle = 'red';
                ctx.fillRect(pl.x - 20, pl.y - 25, 40, 5);
                ctx.fillStyle = 'green';
                ctx.fillRect(pl.x - 20, pl.y - 25, 40 * (pl.health / 100), 5);
            }

            // Update UI elements
            document.getElementById('healthVal').innerText = health;
            document.getElementById('scoreVal').innerText = score;

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
