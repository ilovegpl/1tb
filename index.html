<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 2D Top-Down Shooter - Expanded Edition</title>
    <style>
        body {
            margin: 0;
            background: #0d0f12;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #menu {
            position: absolute;
            background: rgba(18, 20, 26, 0.95);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 128, 0.15);
            border: 1px solid #2a2e3d;
            z-index: 10;
            width: 320px;
        }
        h2 { margin-top: 0; color: #00ff80; letter-spacing: 1px; }
        p { color: #8b9bb4; font-size: 14px; line-height: 1.5; }
        button, input {
            padding: 12px 15px;
            margin: 8px 0;
            font-size: 15px;
            border-radius: 6px;
            border: none;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #00ff80;
            color: #0d0f12;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #00cc66; }
        button:disabled { background: #2a2e3d; color: #555; cursor: not-allowed; }
        input { 
            background: #161922; 
            color: #fff; 
            border: 1px solid #2a2e3d; 
            text-align: center;
            letter-spacing: 3px;
            font-weight: bold;
        }
        input:focus { border-color: #00ff80; }
        canvas {
            background: #13161f;
            border: 2px solid #2a2e3d;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
        }
        #ui {
            display: none;
            position: absolute;
            top: 20px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 5;
            background: rgba(18, 20, 26, 0.8);
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #2a2e3d;
        }
        #shop {
            display: none;
            position: absolute;
            background: rgba(18, 20, 26, 0.95);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #2a2e3d;
            z-index: 10;
            width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #shop h3 { margin-top: 0; color: #00ff80; text-align: center; }
        .weapon-item {
            background: #161922;
            border: 1px solid #2a2e3d;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weapon-info div { font-size: 13px; color: #8b9bb4; }
        .weapon-info b { color: #fff; font-size: 15px; }
        .shop-btn { padding: 6px 12px; font-size: 13px; width: auto; margin: 0; }
        .highlight { color: #00ff80; }
        .money { color: #ffa502; }
    </style>
    <!-- PeerJS for P2P Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="menu">
        <h2>ARENA.IO</h2>
        <p><b>WASD</b> to Move<br><b>Mouse</b> to Aim & Shoot<br><b>B</b> to Open Shop</p>
        <button id="hostBtn">Create Game (Host)</button>
        <div style="margin: 15px 0; border-top: 1px solid #2a2e3d;"></div>
        <input type="text" id="peerIdInput" placeholder="CODE" maxlength="4">
        <button id="joinBtn">Join Game</button>
        <p id="status" style="margin-top: 15px;"></p>
    </div>

    <div id="ui">
        HP: <span id="healthVal" class="highlight">100</span> &nbsp;|&nbsp; 
        SCORE: <span id="scoreVal" class="highlight">0</span> &nbsp;|&nbsp; 
        MONEY: $<span id="moneyVal" class="money">100</span> &nbsp;|&nbsp; 
        GUN: <span id="gunVal" class="highlight">Pistol</span> [Press B]
    </div>

    <div id="shop">
        <h3>GUN SHOP</h3>
        <div id="shopList"></div>
        <button onclick="toggleShop()" style="margin-top: 10px;">Close Shop (B)</button>
    </div>

    <!-- Bigger Canvas Size -->
    <canvas id="gameCanvas" width="1600" height="1200"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const ui = document.getElementById('ui');
        const shopDiv = document.getElementById('shop');
        const statusText = document.getElementById('status');

        let peer, conn;
        let isHost = false;
        let gameStarted = false;
        let shopOpen = false;

        let players = {};
        let bullets = [];
        let myId = null;
        let score = 0;
        let health = 100;
        let money = 100;
        let roundOver = false;
        let roundStatusText = "";

        // Arena Map Walls (X, Y, Width, Height)
        const walls = [
            { x: 300, y: 200, w: 100, h: 300 },
            { x: 1200, y: 200, w: 100, h: 300 },
            { x: 700, y: 400, w: 200, h: 100 },
            { x: 300, y: 800, w: 100, h: 250 },
            { x: 1200, y: 800, w: 100, h: 250 },
            { x: 700, y: 750, w: 200, h: 100 },
            { x: 150, y: 550, w: 150, h: 100 },
            { x: 1300, y: 550, w: 150, h: 100 }
        ];

        const weapons = {
            pistol: { name: 'Pistol', cost: 0, damage: 25, fireRate: 350, speed: 8, spread: 0, count: 1 },
            smg: { name: 'SMG', cost: 250, damage: 12, fireRate: 100, speed: 9, spread: 0.15, count: 1 },
            shotgun: { name: 'Shotgun', cost: 400, damage: 18, fireRate: 700, speed: 7, spread: 0.3, count: 4 },
            sniper: { name: 'Sniper', cost: 600, damage: 75, fireRate: 1200, speed: 15, spread: 0.02, count: 1 }
        };

        let currentWeapon = 'pistol';
        let unlockedWeapons = { pistol: true };

        const keys = {};
        const mouse = { x: 0, y: 0, down: false };

        window.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 'b' && gameStarted) {
                toggleShop();
            }
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('mousemove', e => {
            if (shopOpen) return;
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', () => { if (!shopOpen && !roundOver) mouse.down = true; });
        canvas.addEventListener('mouseup', () => mouse.down = false);

        function toggleShop() {
            shopOpen = !shopOpen;
            shopDiv.style.display = shopOpen ? 'block' : 'none';
            if (shopOpen) {
                mouse.down = false;
                updateShopUI();
            }
        }

        function updateShopUI() {
            let html = '';
            for (let key in weapons) {
                let w = weapons[key];
                let isUnlocked = unlockedWeapons[key];
                let isEquipped = currentWeapon === key;

                html += `
                    <div class="weapon-item">
                        <div class="weapon-info">
                            <b>${w.name}</b>
                            <div>Dmg: ${w.damage} | Rate: ${w.fireRate}ms</div>
                        </div>
                        <div>
                            ${isEquipped ? '<span class="highlight">Equipped</span>' : 
                              isUnlocked ? `<button class="shop-btn" onclick="equipWeapon('${key}')">Equip</button>` : 
                              `<button class="shop-btn" onclick="buyWeapon('${key}')">$${w.cost}</button>`}
                        </div>
                    </div>`;
            }
            document.getElementById('shopList').innerHTML = html;
        }

        function buyWeapon(key) {
            let w = weapons[key];
            if (money >= w.cost) {
                money -= w.cost;
                unlockedWeapons[key] = true;
                currentWeapon = key;
                document.getElementById('gunVal').innerText = w.name;
                document.getElementById('moneyVal').innerText = money;
                
                // Sync updated money to host/client
                if(players[myId]) players[myId].money = money;

                updateShopUI();
            } else {
                alert('Not enough money!');
            }
        }

        function equipWeapon(key) {
            if (unlockedWeapons[key]) {
                currentWeapon = key;
                document.getElementById('gunVal').innerText = weapons[key].name;
                updateShopUI();
            }
        }

        function generateShortCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        document.getElementById('hostBtn').onclick = () => {
            const shortCode = generateShortCode();
            const fullPeerId = 'shooter_' + shortCode;
            
            peer = new Peer(fullPeerId);
            isHost = true;

            peer.on('open', () => {
                myId = fullPeerId;
                statusText.innerHTML = `Your 4-Digit Code:<br><span style="font-size: 26px; color: #00ff80; letter-spacing: 4px;"><b>${shortCode}</b></span><br><br>Waiting for opponent...`;
                document.getElementById('hostBtn').disabled = true;
                document.getElementById('joinBtn').disabled = true;
                document.getElementById('peerIdInput').disabled = true;
            });

            peer.on('error', () => {
                peer.destroy();
                document.getElementById('hostBtn').click();
            });

            peer.on('connection', connection => {
                conn = connection;
                setupConnection();
                startGame();
            });
        };

        document.getElementById('joinBtn').onclick = () => {
            const codeInput = document.getElementById('peerIdInput').value.trim();
            if (codeInput.length !== 4) { alert('Please enter a valid 4-digit code!'); return; }

            const targetId = 'shooter_' + codeInput;
            peer = new Peer();
            isHost = false;

            peer.on('open', id => {
                myId = id;
                conn = peer.connect(targetId);
                setupConnection();
                startGame();
            });

            peer.on('error', () => {
                alert('Could not connect. Check the code and try again.');
            });
        };

        function setupConnection() {
            conn.on('data', data => {
                if (isHost) {
                    if (data.type === 'join') {
                        players[data.id] = {
                            x: Math.random() * 1000 + 300,
                            y: Math.random() * 800 + 200,
                            vx: 0, vy: 0,
                            angle: 0,
                            health: 100,
                            score: 0,
                            money: 100,
                            color: '#00ff80'
                        };
                    } else if (data.type === 'input' && players[data.id] && !roundOver) {
                        players[data.id].x = data.x;
                        players[data.id].y = data.y;
                        players[data.id].vx = data.vx;
                        players[data.id].vy = data.vy;
                        players[data.id].angle = data.angle;
                        players[data.id].money = data.money; // Fix economy sync
                    } else if (data.type === 'shoot' && !roundOver) {
                        data.bullets.forEach(b => bullets.push(b));
                    }
                } else {
                    if (data.type === 'state') {
                        players = data.players;
                        bullets = data.bullets;
                        roundOver = data.roundOver;
                        roundStatusText = data.roundStatusText;
                        if (players[myId]) {
                            health = players[myId].health;
                            score = players[myId].score;
                            money = players[myId].money;
                        }
                    }
                }
            });

            conn.on('close', () => {
                alert('Connection lost.');
                location.reload();
            });
        }

        function startGame() {
            menu.style.display = 'none';
            canvas.style.display = 'block';
            ui.style.display = 'block';
            gameStarted = true;

            players[myId] = {
                x: Math.random() * 1000 + 300,
                y: Math.random() * 800 + 200,
                vx: 0, vy: 0,
                angle: 0,
                health: 100,
                score: 0,
                money: 100,
                color: isHost ? '#ff4757' : '#00ff80'
            };

            if (!isHost) {
                conn.on('open', () => {
                    conn.send({ type: 'join', id: myId });
                });
                setTimeout(() => {
                    conn.send({ type: 'join', id: myId });
                }, 500);
            }

            requestAnimationFrame(gameLoop);
        }

        function checkWallCollision(nx, ny, radius) {
            for (let w of walls) {
                let closestX = Math.max(w.x, Math.min(nx, w.x + w.w));
                let closestY = Math.max(w.y, Math.min(ny, w.y + w.h));
                let distX = nx - closestX;
                let distY = ny - closestY;
                if ((distX * distX + distY * distY) < (radius * radius)) {
                    return true;
                }
            }
            return false;
        }

        let lastShootTime = 0;
        let roundTimer = null;

        function gameLoop() {
            if (!gameStarted) return;

            let p = players[myId];
            if (p && p.health > 0 && !shopOpen && !roundOver) {
                // Slower and smoother movement with acceleration & friction
                let accel = 0.2;
                let friction = 0.88;
                let maxSpeed = 2.2;

                if (keys['w'] || keys['arrowup']) p.vy -= accel;
                if (keys['s'] || keys['arrowdown']) p.vy += accel;
                if (keys['a'] || keys['arrowleft']) p.vx -= accel;
                if (keys['d'] || keys['arrowright']) p.vx += accel;

                p.vx *= friction;
                p.vy *= friction;

                // Apply movement with wall collision checks
                let nextX = p.x + p.vx;
                let nextY = p.y + p.vy;

                if (!checkWallCollision(nextX, p.y, 15) && nextX > 15 && nextX < canvas.width - 15) {
                    p.x = nextX;
                } else {
                    p.vx = 0;
                }

                if (!checkWallCollision(p.x, nextY, 15) && nextY > 15 && nextY < canvas.height - 15) {
                    p.y = nextY;
                } else {
                    p.vy = 0;
                }

                p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);

                let wData = weapons[currentWeapon];
                if (mouse.down && Date.now() - lastShootTime > wData.fireRate) {
                    lastShootTime = Date.now();
                    let spawnedBullets = [];

                    for (let i = 0; i < wData.count; i++) {
                        let spreadAngle = p.angle + (Math.random() - 0.5) * wData.spread;
                        spawnedBullets.push({
                            x: p.x,
                            y: p.y,
                            vx: Math.cos(spreadAngle) * wData.speed,
                            vy: Math.sin(spreadAngle) * wData.speed,
                            damage: wData.damage,
                            owner: myId
                        });
                    }

                    if (isHost) {
                        spawnedBullets.forEach(b => bullets.push(b));
                    } else {
                        conn.send({ type: 'shoot', bullets: spawnedBullets });
                    }
                }

                if (!isHost) {
                    conn.send({ type: 'input', id: myId, x: p.x, y: p.y, vx: p.vx, vy: p.vy, angle: p.angle, money: money });
                }
            }

            if (isHost && !roundOver) {
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    // Boundary or Wall collision for bullets
                    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || checkWallCollision(b.x, b.y, 4)) {
                        bullets.splice(i, 1);
                        continue;
                    }

                    let hit = false;
                    for (let id in players) {
                        if (id !== b.owner && players[id].health > 0) {
                            let dist = Math.hypot(players[id].x - b.x, players[id].y - b.y);
                            if (dist < 15) {
                                players[id].health -= b.damage;
                                hit = true;

                                if (players[b.owner]) {
                                    players[b.owner].money += 50;
                                }

                                if (players[id].health <= 0) {
                                    if (players[b.owner]) {
                                        players[b.owner].score += 1;
                                        players[b.owner].money += 200;
                                    }
                                    
                                    // Trigger Round Over Cooldown
                                    roundOver = true;
                                    let winnerName = (b.owner === myId) ? "You" : "Opponent";
                                    roundStatusText = `Round Over! ${winnerName} Scored! Restarting in 3s...`;

                                    setTimeout(() => {
                                        bullets = [];
                                        for (let pid in players) {
                                            players[pid].health = 100;
                                            players[pid].x = Math.random() * 1000 + 300;
                                            players[pid].y = Math.random() * 800 + 200;
                                            players[pid].vx = 0;
                                            players[pid].vy = 0;
                                        }
                                        roundOver = false;
                                        roundStatusText = "";
                                    }, 3000);
                                }
                                break;
                            }
                        }
                    }
                    if (hit) {
                        bullets.splice(i, 1);
                    }
                }
                conn.send({ type: 'state', players: players, bullets: bullets, roundOver: roundOver, roundStatusText: roundStatusText });
            }

            // Render Arena
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid pattern (wider grid)
            ctx.strokeStyle = '#181b25';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 60) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 60) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Walls
            ctx.fillStyle = '#212633';
            ctx.strokeStyle = '#323846';
            ctx.lineWidth = 2;
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            });

            // Draw Bullets
            ctx.fillStyle = '#ffa502';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Players
            for (let id in players) {
                let pl = players[id];
                if (pl.health <= 0) continue;

                ctx.save();
                ctx.translate(pl.x, pl.y);
                ctx.rotate(pl.angle);

                // Gun Barrel
                ctx.fillStyle = '#4b5563';
                ctx.fillRect(0, -4, 22, 8);

                // Body
                ctx.fillStyle = pl.color;
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                ctx.restore();

                // Health Bar
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(pl.x - 20, pl.y - 28, 40, 6);
                ctx.fillStyle = pl.color;
                ctx.fillRect(pl.x - 20, pl.y - 28, 40 * (Math.max(0, pl.health) / 100), 6);
            }

            // Draw Round Over Text Overlay
            if (roundOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff80';
                ctx.font = 'bold 36px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(roundStatusText, canvas.width / 2, canvas.height / 2);
            }

            document.getElementById('healthVal').innerText = Math.max(0, health);
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('moneyVal').innerText = money;

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
