<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 2D Top-Down Shooter - Ultimate Edition</title>
    <style>
        body {
            margin: 0;
            background: #0d0f12;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #menu {
            position: absolute;
            background: rgba(18, 20, 26, 0.95);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 128, 0.15);
            border: 1px solid #2a2e3d;
            z-index: 10;
            width: 320px;
        }
        h2 { margin-top: 0; color: #00ff80; letter-spacing: 1px; }
        p { color: #8b9bb4; font-size: 14px; line-height: 1.5; }
        button, input {
            padding: 12px 15px;
            margin: 8px 0;
            font-size: 15px;
            border-radius: 6px;
            border: none;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #00ff80;
            color: #0d0f12;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #00cc66; }
        button:disabled { background: #2a2e3d; color: #555; cursor: not-allowed; }
        input { 
            background: #161922; 
            color: #fff; 
            border: 1px solid #2a2e3d; 
            text-align: center;
            letter-spacing: 3px;
            font-weight: bold;
        }
        input:focus { border-color: #00ff80; }
        canvas {
            background: #13161f;
            border: 2px solid #2a2e3d;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
        }
        #ui {
            display: none;
            position: absolute;
            top: 20px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 5;
            background: rgba(18, 20, 26, 0.9);
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #2a2e3d;
        }
        #shop {
            display: none;
            position: absolute;
            background: rgba(18, 20, 26, 0.95);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #2a2e3d;
            z-index: 10;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
        }
        #shop h3 { margin-top: 0; color: #00ff80; }
        .weapon-item {
            background: #161922;
            border: 1px solid #2a2e3d;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .weapon-info div { font-size: 12px; color: #8b9bb4; }
        .weapon-info b { color: #fff; font-size: 14px; }
        .shop-btn { padding: 6px 12px; font-size: 13px; width: auto; margin: 0; }
        .highlight { color: #00ff80; }
        .money { color: #ffa502; }
    </style>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="menu">
        <h2>ARENA.IO</h2>
        <p><b>WASD</b> to Move<br><b>Mouse</b> to Aim & Shoot<br><b>B</b> to Open Shop</p>
        <button id="hostBtn">Create Game (Host)</button>
        <div style="margin: 15px 0; border-top: 1px solid #2a2e3d;"></div>
        <input type="text" id="peerIdInput" placeholder="CODE" maxlength="4">
        <button id="joinBtn">Join Game</button>
        <p id="status" style="margin-top: 15px;"></p>
    </div>

    <div id="ui">
        ROUND: <span id="roundVal" class="highlight">1</span> &nbsp;|&nbsp; 
        PHASE: <span id="phaseVal" class="highlight">BUYING</span> (<span id="timerVal">10</span>s) &nbsp;|&nbsp; 
        HP: <span id="healthVal" class="highlight">100</span> &nbsp;|&nbsp; 
        SCORE: <span id="scoreVal" class="highlight">0</span> &nbsp;|&nbsp; 
        MONEY: $<span id="moneyVal" class="money">0</span> &nbsp;|&nbsp; 
        GUN: <span id="gunVal" class="highlight">Pistol</span>
    </div>

    <div id="shop">
        <h3>ARMORY SHOP</h3>
        <p id="shopTimerMsg" style="font-size: 12px; color: #ffa502; margin-bottom: 10px;">Buy phase active! Prepare for battle.</p>
        <div id="shopList"></div>
        <button onclick="toggleShop()" style="margin-top: 10px;">Close Shop (B)</button>
    </div>

    <canvas id="gameCanvas" width="1200" height="800"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const ui = document.getElementById('ui');
        const shopDiv = document.getElementById('shop');
        const statusText = document.getElementById('status');

        let peer, conn;
        let isHost = false;
        let gameStarted = false;
        let shopOpen = false;

        let players = {};
        let bullets = [];
        let myId = null;
        let score = 0;
        let health = 100;
        let money = 400; // Initial starter cash

        let round = 1;
        let roundPhase = 'buy'; // 'buy' or 'combat'
        let phaseTimer = 15; // seconds

        // Larger map walls setup (x, y, w, h)
        const walls = [
            { x: 0, y: 0, w: 1200, h: 20 },   // Top boundary
            { x: 0, y: 780, w: 1200, h: 20 }, // Bottom boundary
            { x: 0, y: 0, w: 20, h: 800 },    // Left boundary
            { x: 1180, y: 0, w: 20, h: 800 }, // Right boundary
            // Inner tactical walls/barriers
            { x: 300, y: 200, w: 600, h: 40 },
            { x: 300, y: 560, w: 600, h: 40 },
            { x: 200, y: 300, w: 40, h: 200 },
            { x: 960, y: 300, w: 40, h: 200 }
        ];

        // Safe, isolated static spawn points
        const spawnPoints = [
            { x: 100, y: 100 },  // Spawn 1 (Top-Left corner pocket)
            { x: 1100, y: 700 }  // Spawn 2 (Bottom-Right corner pocket)
        ];

        const weapons = {
            pistol: { name: 'Pistol', cost: 0, damage: 25, fireRate: 400, speed: 10, spread: 0, count: 1 },
            smg: { name: 'SMG', cost: 500, damage: 14, fireRate: 110, speed: 11, spread: 0.12, count: 1 },
            shotgun: { name: 'Shotgun', cost: 850, damage: 20, fireRate: 800, speed: 9, spread: 0.25, count: 5 },
            sniper: { name: 'Sniper Rifle', cost: 1200, damage: 85, fireRate: 1300, speed: 18, spread: 0.01, count: 1 }
        };

        let currentWeapon = 'pistol';
        let unlockedWeapons = { pistol: true };

        const keys = {};
        const mouse = { x: 0, y: 0, down: false };

        window.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 'b' && gameStarted) {
                toggleShop();
            }
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('mousemove', e => {
            if (shopOpen) return;
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', () => { if (!shopOpen && roundPhase === 'combat') mouse.down = true; });
        canvas.addEventListener('mouseup', () => mouse.down = false);

        function toggleShop() {
            shopOpen = !shopOpen;
            shopDiv.style.display = shopOpen ? 'block' : 'none';
            if (shopOpen) {
                mouse.down = false;
                updateShopUI();
            }
        }

        function updateShopUI() {
            let html = '';
            for (let key in weapons) {
                let w = weapons[key];
                let isUnlocked = unlockedWeapons[key];
                let isEquipped = currentWeapon === key;

                html += `
                    <div class="weapon-item">
                        <div class="weapon-info">
                            <b>${w.name}</b>
                            <div>Dmg: ${w.damage} | Rate: ${w.fireRate}ms</div>
                        </div>
                        <div>
                            ${isEquipped ? '<span class="highlight">Equipped</span>' : 
                              isUnlocked ? `<button class="shop-btn" onclick="equipWeapon('${key}')">Equip</button>` : 
                              roundPhase === 'buy' ? `<button class="shop-btn" onclick="buyWeapon('${key}')">$${w.cost}</button>` : 
                              '<span style="color:#555;font-size:12px;">Combat Locked</span>'}
                        </div>
                    </div>`;
            }
            document.getElementById('shopList').innerHTML = html;
        }

        function buyWeapon(key) {
            if (roundPhase !== 'buy') {
                alert('Weapons can only be purchased during the Buy Phase!');
                return;
            }
            let w = weapons[key];
            if (money >= w.cost) {
                money -= w.cost;
                unlockedWeapons[key] = true;
                currentWeapon = key;
                document.getElementById('gunVal').innerText = w.name;
                updateShopUI();
            } else {
                alert('Not enough money!');
            }
        }

        function equipWeapon(key) {
            if (unlockedWeapons[key]) {
                currentWeapon = key;
                document.getElementById('gunVal').innerText = weapons[key].name;
                updateShopUI();
            }
        }

        function generateShortCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        document.getElementById('hostBtn').onclick = () => {
            const shortCode = generateShortCode();
            const fullPeerId = 'shooter_' + shortCode;
            
            peer = new Peer(fullPeerId);
            isHost = true;

            peer.on('open', () => {
                myId = fullPeerId;
                statusText.innerHTML = `Your 4-Digit Code:<br><span style="font-size: 26px; color: #00ff80; letter-spacing: 4px;"><b>${shortCode}</b></span><br><br>Waiting for opponent...`;
                document.getElementById('hostBtn').disabled = true;
                document.getElementById('joinBtn').disabled = true;
                document.getElementById('peerIdInput').disabled = true;
            });

            peer.on('error', () => {
                peer.destroy();
                document.getElementById('hostBtn').click();
            });

            peer.on('connection', connection => {
                conn = connection;
                setupConnection();
                startGame();
            });
        };

        document.getElementById('joinBtn').onclick = () => {
            const codeInput = document.getElementById('peerIdInput').value.trim();
            if (codeInput.length !== 4) { alert('Please enter a valid 4-digit code!'); return; }

            const targetId = 'shooter_' + codeInput;
            peer = new Peer();
            isHost = false;

            peer.on('open', id => {
                myId = id;
                conn = peer.connect(targetId);
                setupConnection();
                startGame();
            });

            peer.on('error', () => {
                alert('Could not connect. Check the code and try again.');
            });
        };

        function setupConnection() {
            conn.on('data', data => {
                if (isHost) {
                    if (data.type === 'join') {
                        const spawn = spawnPoints[1];
                        players[data.id] = {
                            x: spawn.x,
                            y: spawn.y,
                            vx: 0, vy: 0,
                            angle: 0,
                            health: 100,
                            score: 0,
                            money: 400,
                            color: '#00ff80'
                        };
                    } else if (data.type === 'input' && players[data.id]) {
                        // Apply movement and collision checks server-side for client
                        updatePlayerPosition(players[data.id], data.keys, data.angle);
                    } else if (data.type === 'shoot') {
                        if (roundPhase === 'combat') {
                            data.bullets.forEach(b => bullets.push(b));
                        }
                    }
                } else {
                    if (data.type === 'state') {
                        players = data.players;
                        bullets = data.bullets;
                        round = data.round;
                        roundPhase = data.roundPhase;
                        phaseTimer = data.phaseTimer;
                        
                        if (players[myId]) {
                            health = players[myId].health;
                            score = players[myId].score;
                            money = players[myId].money;
                        }
                    }
                }
            });

            conn.on('close', () => {
                alert('Connection lost.');
                location.reload();
            });
        }

        function startGame() {
            menu.style.display = 'none';
            canvas.style.display = 'block';
            ui.style.display = 'block';
            gameStarted = true;

            const spawnIndex = isHost ? 0 : 1;
            const spawn = spawnPoints[spawnIndex];

            players[myId] = {
                x: spawn.x,
                y: spawn.y,
                vx: 0, vy: 0,
                angle: 0,
                health: 100,
                score: 0,
                money: 400,
                color: isHost ? '#ff4757' : '#00ff80'
            };

            if (!isHost) {
                setTimeout(() => {
                    conn.send({ type: 'join', id: myId });
                }, 500);
            } else {
                startRoundLoop();
            }

            requestAnimationFrame(gameLoop);
        }

        // Host round state ticker
        function startRoundLoop() {
            setInterval(() => {
                phaseTimer--;
                if (phaseTimer <= 0) {
                    if (roundPhase === 'buy') {
                        roundPhase = 'combat';
                        phaseTimer = 30; // 30 seconds combat phase
                        if (shopOpen) toggleShop();
                    } else {
                        roundPhase = 'buy';
                        phaseTimer = 15; // 15 seconds shop/buy phase
                        round++;
                        // Passive round income for survival
                        for (let id in players) {
                            players[id].money += 300;
                            players[id].health = 100;
                            const idx = id === myId ? 0 : 1;
                            players[id].x = spawnPoints[idx].x;
                            players[id].y = spawnPoints[idx].y;
                        }
                    }
                }
            }, 1000);
        }

        function checkRectCollision(nx, ny, size, walls) {
            for (let w of walls) {
                if (nx + size > w.x && nx - size < w.x + w.w &&
                    ny + size > w.y && ny - size < w.y + w.h) {
                    return true;
                }
            }
            return false;
        }

        function updatePlayerPosition(p, activeKeys, targetAngle) {
            let accel = 0.35;
            let friction = 0.85;
            let maxSpeed = 3.0; // Slower, tactical movement speed

            if (activeKeys['w'] || activeKeys['arrowup']) p.vy -= accel;
            if (activeKeys['s'] || activeKeys['arrowdown']) p.vy += accel;
            if (activeKeys['a'] || activeKeys['arrowleft']) p.vx -= accel;
            if (activeKeys['d'] || activeKeys['arrowright']) p.vx += accel;

            p.vx *= friction;
            p.vy *= friction;

            // Clamp velocity
            p.vx = Math.max(-maxSpeed, Math.min(maxSpeed, p.vx));
            p.vy = Math.max(-maxSpeed, Math.min(maxSpeed, p.vy));

            let nextX = p.x + p.vx;
            let nextY = p.y + p.vy;
            let radius = 15;

            // Separate axis collision for smooth sliding against walls
            if (!checkRectCollision(nextX, p.y, radius, walls)) {
                p.x = nextX;
            } else {
                p.vx = 0;
            }

            if (!checkRectCollision(p.x, nextY, radius, walls)) {
                p.y = nextY;
            } else {
                p.vy = 0;
            }

            p.angle = targetAngle;
        }

        let lastShootTime = 0;
        function gameLoop() {
            if (!gameStarted) return;

            let p = players[myId];
            if (p && p.health > 0 && !shopOpen) {
                let targetAngle = Math.atan2(mouse.y - p.y, mouse.x - p.x);

                if (isHost) {
                    updatePlayerPosition(p, keys, targetAngle);
                }

                let wData = weapons[currentWeapon];
                if (mouse.down && roundPhase === 'combat' && Date.now() - lastShootTime > wData.fireRate) {
                    lastShootTime = Date.now();
                    let spawnedBullets = [];

                    for (let i = 0; i < wData.count; i++) {
                        let spreadAngle = targetAngle + (Math.random() - 0.5) * wData.spread;
                        spawnedBullets.push({
                            x: p.x,
                            y: p.y,
                            vx: Math.cos(spreadAngle) * wData.speed,
                            vy: Math.sin(spreadAngle) * wData.speed,
                            damage: wData.damage,
                            owner: myId
                        });
                    }

                    if (isHost) {
                        spawnedBullets.forEach(b => bullets.push(b));
                    } else {
                        conn.send({ type: 'shoot', bullets: spawnedBullets });
                    }
                }

                if (!isHost) {
                    conn.send({ type: 'input', id: myId, keys: keys, angle: targetAngle });
                }
            }

            if (isHost) {
                // Bullet updates & wall collisions
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    let hitWall = false;
                    for (let w of walls) {
                        if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) {
                            hitWall = true;
                            break;
                        }
                    }

                    if (hitWall) {
                        bullets.splice(i, 1);
                        continue;
                    }

                    let hit = false;
                    for (let id in players) {
                        if (id !== b.owner && players[id].health > 0) {
                            let dist = Math.hypot(players[id].x - b.x, players[id].y - b.y);
                            if (dist < 15) {
                                players[id].health -= b.damage;
                                hit = true;

                                // Rewarding damage cash
                                if (players[b.owner]) {
                                    players[b.owner].money += 25;
                                }

                                if (players[id].health <= 0) {
                                    if (players[b.owner]) {
                                        players[b.owner].score += 1;
                                        players[b.owner].money += 250; // Kill bonus cash
                                    }
                                }
                                break;
                            }
                        }
                    }
                    if (hit) {
                        bullets.splice(i, 1);
                    }
                }

                conn.send({ 
                    type: 'state', 
                    players: players, 
                    bullets: bullets, 
                    round: round, 
                    roundPhase: roundPhase, 
                    phaseTimer: phaseTimer 
                });
            }

            // Render Arena
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid pattern
            ctx.strokeStyle = '#181b25';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Walls
            ctx.fillStyle = '#212633';
            ctx.strokeStyle = '#2a2e3d';
            ctx.lineWidth = 2;
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            });

            // Draw Bullets
            ctx.fillStyle = '#ffa502';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Players
            for (let id in players) {
                let pl = players[id];
                if (pl.health <= 0) continue;

                ctx.save();
                ctx.translate(pl.x, pl.y);
                ctx.rotate(pl.angle);

                // Gun Barrel
                ctx.fillStyle = '#4b5563';
                ctx.fillRect(0, -4, 22, 8);

                // Body
                ctx.fillStyle = pl.color;
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                ctx.restore();

                // Health Bar
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(pl.x - 20, pl.y - 28, 40, 6);
                ctx.fillStyle = pl.color;
                ctx.fillRect(pl.x - 20, pl.y - 28, 40 * (Math.max(0, pl.health) / 100), 6);
            }

            // UI Updates
            document.getElementById('roundVal').innerText = round;
            document.getElementById('phaseVal').innerText = roundPhase.toUpperCase();
            document.getElementById('timerVal').innerText = phaseTimer;
            document.getElementById('healthVal').innerText = Math.max(0, health);
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('moneyVal').innerText = money;

            let shopMsg = document.getElementById('shopTimerMsg');
            if (roundPhase === 'buy') {
                shopMsg.innerText = `Buy phase active! (${phaseTimer}s remaining)`;
                shopMsg.style.color = '#00ff80';
            } else {
                shopMsg.innerText = `Combat active! Shop locked until next round.`;
                shopMsg.style.color = '#ff4757';
            }

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
